    <!-- Instant Theme Detection (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cerilas_theme');
          var isDark = saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#000000' : '#ffffff');
        } catch (e) {}
      })();
    </script>
