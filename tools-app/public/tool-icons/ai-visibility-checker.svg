<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="176" height="176" rx="42" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2.5" />
  
  <!-- Subtle Radar Waves -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />
  <circle cx="96" cy="96" r="48" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Central Eye Outer Contour -->
  <path d="M 40 96 C 58 64, 134 64, 152 96 C 134 128, 58 128, 40 96 Z" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Central Pupil / AI Target -->
  <circle cx="96" cy="96" r="18" fill="url(#glowGrad)" />
  <circle cx="96" cy="96" r="8" fill="#ffffff" />
  
  <!-- AI Sparkle Top Right -->
  <path d="M 136 44 Q 136 54 146 54 Q 136 54 136 64 Q 136 54 126 54 Q 136 54 136 44 Z" fill="url(#sparkleGrad)" />
</svg>
