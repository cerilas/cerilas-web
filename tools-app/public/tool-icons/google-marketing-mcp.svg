<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Deep Space Obsidian Squircle Background -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <!-- Top Rim Specular Highlight -->
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Apple Vibrant Azure Gradient (Search Console & Protocol) -->
    <linearGradient id="azureGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Apple Vibrant Sunset Amber Gradient (Analytics & Insights) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Subtle Ambient Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Apple Squircle Base -->
  <rect x="8" y="8" width="176" height="176" rx="44" fill="url(#appleBg)" stroke="url(#rimHighlight)" stroke-width="1.5" />
  
  <!-- Subtle Internal Ambient Light -->
  <circle cx="96" cy="96" r="60" fill="url(#centerGlow)" />

  <!-- 2. Minimalist Search Console Pulse Ring (Left) -->
  <circle cx="80" cy="96" r="32" fill="none" stroke="url(#azureGrad)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- 3. Minimalist Analytics Pulse Ring (Right) Intersecting into Infinity / Protocol -->
  <circle cx="112" cy="96" r="32" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- 4. Pure Minimalist Bridge Bars (Inside the Rings) -->
  <!-- Left Search Beam -->
  <line x1="80" y1="96" x2="80" y2="76" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Center Core MCP Connection Node -->
  <circle cx="96" cy="96" r="6.5" fill="#ffffff" />
  <circle cx="96" cy="96" r="11" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" />

  <!-- Right Ascending Metric Bar -->
  <line x1="112" y1="104" x2="112" y2="82" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

  <!-- 5. Subtle Top-Right AI Micro-Sparkle -->
  <circle cx="146" cy="46" r="2.5" fill="#60a5fa" />
</svg>
