<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  
  <!-- Subtle Ambient Glows -->
  <circle cx="220" cy="180" r="320" fill="#3b82f6" opacity="0.18" filter="blur(140px)"/>
  <circle cx="980" cy="460" r="340" fill="#10b981" opacity="0.15" filter="blur(150px)"/>
  
  <!-- Modern Geometric Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Cerilas Badge -->
  <g transform="translate(90, 85)">
    <rect width="195" height="38" rx="19" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.35)"/>
    <circle cx="20" cy="19" r="5" fill="#3b82f6"/>
    <text x="35" y="24" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CERILAS TOOLS</text>
  </g>

  <!-- Main Title -->
  <text x="90" y="205" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">
    Free Image Compressor
  </text>
  <text x="90" y="265" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="500" letter-spacing="-0.5">
    Reduce Size up to 90% • Zero Quality Loss
  </text>

  <!-- Value Propositions -->
  <text x="90" y="340" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    100% In-Browser Privacy • Zero Server Uploads • Unlimited Batch ZIP
  </text>
  <text x="90" y="378" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">
    High-efficiency WebP, JPEG, PNG, and AVIF compression optimized for Google Core Web Vitals.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(90, 455)">
    <!-- Pill 1 -->
    <rect width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="22" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">🔒 100% Private</text>
    
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="210" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="22" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">⚡ Web Worker C++</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(420, 0)">
      <rect width="170" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="22" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">📦 Batch ZIP</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(605, 0)">
      <rect width="185" height="42" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)"/>
      <text x="22" y="26" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">🎯 Google LCP #1</text>
    </g>
  </g>

  <!-- Illustration on Right Side: Frosted Comparison Card Mockup -->
  <g transform="translate(850, 140)">
    <!-- Card Backing -->
    <rect width="280" height="340" rx="24" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.12)" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.6))"/>
    
    <!-- Image View Mockup -->
    <g transform="translate(20, 20)">
      <!-- Left side: Original -->
      <rect width="120" height="180" rx="14" fill="#1e293b"/>
      <circle cx="60" cy="70" r="28" fill="#38bdf8" opacity="0.8"/>
      <path d="M20 160 L50 120 L80 150 L110 100 L140 160 Z" fill="#0284c7" opacity="0.6"/>
      <rect x="15" y="145" width="90" height="24" rx="6" fill="rgba(0,0,0,0.7)"/>
      <text x="22" y="161" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">3.4 MB (Raw)</text>

      <!-- Right side: Compressed -->
      <g transform="translate(120, 0)">
        <rect width="120" height="180" rx="14" fill="#0f172a"/>
        <circle cx="60" cy="70" r="28" fill="#38bdf8" opacity="0.8"/>
        <path d="M20 160 L50 120 L80 150 L110 100 L140 160 Z" fill="#0284c7" opacity="0.6"/>
        <rect x="15" y="145" width="90" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)"/>
        <text x="22" y="161" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">380 KB (-89%)</text>
      </g>

      <!-- Center Divider Line -->
      <line x1="120" y1="0" x2="120" y2="180" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="120" cy="90" r="14" fill="#3b82f6"/>
      <path d="M116 90 L119 86 L119 94 Z M124 90 L121 86 L121 94 Z" fill="#ffffff"/>
    </g>

    <!-- Metrics Bar in Card -->
    <g transform="translate(20, 220)">
      <rect width="240" height="85" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <text x="18" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Efficiency Gain</text>
      <text x="18" y="62" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700">89% Saved</text>
      
      <rect x="160" y="24" width="65" height="42" rx="8" fill="rgba(59, 130, 246, 0.15)"/>
      <text x="175" y="50" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">WebP</text>
    </g>
  </g>
</svg>
