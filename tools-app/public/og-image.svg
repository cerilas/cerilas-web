<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background Dark Gradient -->
  <rect width="1200" height="630" fill="#09090b"/>
  
  <!-- Subtle Glow Gradients -->
  <circle cx="200" cy="150" r="300" fill="#863bff" opacity="0.18" filter="blur(140px)"/>
  <circle cx="1000" cy="480" r="320" fill="#3b82f6" opacity="0.15" filter="blur(150px)"/>
  
  <!-- Grid Accent Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Cerilas Badge -->
  <g transform="translate(100, 100)">
    <rect width="175" height="38" rx="19" fill="rgba(134, 59, 255, 0.12)" stroke="rgba(134, 59, 255, 0.3)"/>
    <text x="22" y="24" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">CERILAS TOOLS</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="220" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">
    Free QR Code Generator
  </text>
  <text x="100" y="285" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="400" letter-spacing="-0.5">
    No Sign-Up, Never Expires.
  </text>

  <!-- Description -->
  <text x="100" y="360" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" line-height="34">
    100% Free Forever • Unlimited Lifetime Scans • Vector SVG &amp; Ultra-HD PNG
  </text>
  <text x="100" y="398" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18">
    Direct matrix encoding for URLs, Wi-Fi, vCard, Google Reviews &amp; AI Art.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <rect width="160" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="24" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">Zero Signup</text>
    
    <g transform="translate(180, 0)">
      <rect width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="24" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">Never Expiring</text>
    </g>

    <g transform="translate(380, 0)">
      <rect width="170" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="24" y="26" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">Vector SVG</text>
    </g>

    <g transform="translate(570, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)"/>
      <text x="24" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500">Level H AI Ready</text>
    </g>
  </g>

  <!-- Illustrated QR Mockup on Right -->
  <g transform="translate(860, 160)">
    <!-- Frosted Card Backing -->
    <rect width="240" height="240" rx="28" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.12)" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.5))"/>
    
    <!-- Stylized QR Corner Targets -->
    <!-- Top-Left Target -->
    <rect x="30" y="30" width="54" height="54" rx="8" stroke="#ffffff" stroke-width="6" fill="none"/>
    <rect x="42" y="42" width="30" height="30" rx="4" fill="#863bff"/>

    <!-- Top-Right Target -->
    <rect x="156" y="30" width="54" height="54" rx="8" stroke="#ffffff" stroke-width="6" fill="none"/>
    <rect x="168" y="42" width="30" height="30" rx="4" fill="#3b82f6"/>

    <!-- Bottom-Left Target -->
    <rect x="30" y="156" width="54" height="54" rx="8" stroke="#ffffff" stroke-width="6" fill="none"/>
    <rect x="42" y="168" width="30" height="30" rx="4" fill="#10b981"/>

    <!-- Stylized Matrix Elements -->
    <rect x="100" y="34" width="16" height="16" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="124" y="50" width="16" height="32" rx="3" fill="#863bff" opacity="0.9"/>
    <rect x="100" y="70" width="16" height="16" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="34" y="100" width="32" height="16" rx="3" fill="#3b82f6" opacity="0.9"/>
    <rect x="74" y="100" width="16" height="36" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="100" y="104" width="36" height="36" rx="6" fill="#863bff"/>
    <rect x="150" y="100" width="20" height="16" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="180" y="104" width="30" height="30" rx="4" fill="#10b981"/>
    <rect x="104" y="156" width="18" height="18" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="132" y="156" width="22" height="40" rx="4" fill="#3b82f6" opacity="0.9"/>
    <rect x="164" y="160" width="46" height="18" rx="3" fill="#ffffff" opacity="0.85"/>
    <rect x="104" y="184" width="18" height="26" rx="3" fill="#10b981" opacity="0.9"/>
    <rect x="164" y="188" width="46" height="22" rx="4" fill="#863bff"/>
  </g>
</svg>
